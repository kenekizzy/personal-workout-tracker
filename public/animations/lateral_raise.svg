<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" style="background:#13151b;border-radius:12px;">
  <style>
    @keyframes exerciseLoop {
      0% { transform: translateY(30px) scaleX(0.7); }
      50% { transform: translateY(-10px) scaleX(1.2); }
      100% { transform: translateY(30px) scaleX(0.7); }
    }
    .anim-bar {
      animation: exerciseLoop 2.4s ease-in-out infinite;
      transform-origin: center;
    }
    .pulse-glow {
      animation: glowPulse 2.4s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
  </style>
  <defs>
    <radialGradient id="grad-Lateral Raise" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#13151b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" fill="#13151b"/>
  <circle cx="100" cy="100" r="70" fill="url(#grad-Lateral Raise)" class="pulse-glow"/>
  <!-- Base Bench/Platform -->
  <line x1="30" y1="160" x2="170" y2="160" stroke="#2a2e39" stroke-width="4" stroke-linecap="round"/>
  <!-- Figure -->
  <g stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="100" cy="65" r="10"/><path d="M100 75 L100 125 L90 160 M100 125 L110 160"/>
  </g>
  <!-- Moving weights/bar -->
  <g class="anim-bar" stroke="#9333ea" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="50" y1="90" x2="150" y2="90"/>
    <circle cx="50" cy="90" r="8" fill="#9333ea"/>
    <circle cx="150" cy="90" r="8" fill="#9333ea"/>
  </g>
  <text x="100" y="185" fill="#8e95a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
    LATERAL RAISE
  </text>
</svg>